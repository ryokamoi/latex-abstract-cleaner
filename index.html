<!DOCTYPE html>
<html>
<head>
  <title>LaTeX Abstract Cleaner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="app">
    <h1>LaTeX Abstract Cleaner</h1>
    <p class="subtitle">Clean noisy abstract text and manage custom replacements with simple editable rules.</p>

    <section class="section">
      <h2>Input</h2>
      <textarea id="input" placeholder="Paste abstract here"></textarea>
    </section>

    <section class="section">
      <h2>Custom Replacements</h2>
      <p class="helper">Rules are applied top to bottom. Leave "Find" empty to skip a row.</p>
      <div class="replacement-panel">
        <div class="replacement-head">
          <span>Find</span>
          <span>Replace With</span>
          <span>Remove</span>
        </div>
        <div id="replacementsContainer"></div>
        <div class="toolbar">
          <button class="btn btn-secondary" id="addRuleButton" type="button">+ Add Rule</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="toolbar">
        <button class="btn btn-primary" id="cleanButton" type="button">Clean Up</button>
      </div>
    </section>

    <section class="section">
      <h2>Output</h2>
      <div class="toolbar output-toolbar">
        <button class="btn btn-secondary" id="copyButton" type="button">Copy Output</button>
        <span id="copyStatus" class="copy-status" aria-live="polite"></span>
      </div>
      <textarea id="output"></textarea>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
